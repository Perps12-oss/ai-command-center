name: UCGS Architecture Gate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ucgs-check:
    runs-on: ubuntu-latest
    env:
      # Track 2 Stage 3 (UCGS Phase 3): block merges on FAIL / S4 / S5.
      # Draft PR escape hatch: set UCGS_ENFORCEMENT=warn in workflow_dispatch override only.
      UCGS_ENFORCEMENT: block

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Need full history so base...HEAD three-dot diffs resolve.
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml gitpython

      - name: Resolve UCGS CI diff range
        id: ucgs_range
        shell: bash
        run: |
          set -euo pipefail
          echo "UCGS_DIFF_MODE=range" >> "$GITHUB_ENV"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            # push to main — compare previous tip to this SHA
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
            if [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]]; then
              BASE="$(git rev-parse HEAD~1)"
            fi
          fi
          echo "UCGS_DIFF_BASE=$BASE" >> "$GITHUB_ENV"
          echo "UCGS_DIFF_HEAD=$HEAD" >> "$GITHUB_ENV"
          echo "Resolved UCGS range: $BASE...$HEAD"
          git rev-parse --verify "$BASE"
          git rev-parse --verify "$HEAD"
          git diff --name-only "${BASE}...${HEAD}" | head -50 || true

      - name: Run Constitution Gate
        run: python scripts/verify_constitution.py

      - name: Run UCGS v5 Gate
        run: python tools/ucgs_runner.py > ucgs_report.yaml

      - name: Evaluate Verdict
        run: python tools/ucgs_ci_gate.py ucgs_report.yaml

      - name: Prove UCGS range mode is not staged-empty
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, yaml
          from pathlib import Path
          report = yaml.safe_load(Path("ucgs_report.yaml").read_text())
          ctx = report.get("context") or {}
          assert ctx.get("diff_mode") == "range", ctx
          assert os.environ.get("UCGS_DIFF_BASE"), "UCGS_DIFF_BASE unset"
          # Staged must be empty in CI; range mode must still have run.
          import subprocess
          staged = subprocess.check_output(
              ["git", "diff", "--cached", "--name-only"], text=True
          ).strip()
          assert staged == "", f"unexpected staged files in CI: {staged!r}"
          print("UCGS CI range-mode proof OK:", ctx.get("diff_base"), "...", ctx.get("diff_head"))
          print("changed_files count:", len(ctx.get("changed_files") or []))
          PY

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-test.txt

      - name: Ruff check
        run: python -m ruff check ai_command_center

      - name: Ruff F821 (undefined names)
        run: python -m ruff check ai_command_center --select F821

      - name: Pytest (incl. UCGS negative/positive semantics)
        run: python -m pytest tests -q

      - name: Upload UCGS report
        uses: actions/upload-artifact@v4
        with:
          name: ucgs-report
          path: ucgs_report.yaml
