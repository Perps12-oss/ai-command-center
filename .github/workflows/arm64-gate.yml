name: ARM64 Native Gate

# Two-tier PE contract on a native Windows ARM64 runner.
# Do not use windows-latest (x86-64): that cannot prove ARM64 Python/Ollama.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  arm64-gate:
    name: Native ARM64 verification
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python (native ARM64)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: arm64

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-test.txt

      - name: Confirm interpreter is native ARM64
        run: python -c "import platform,sys; m=platform.machine().upper(); print(m); sys.exit(0 if m=='ARM64' else 1)"

      - name: Two-tier PE scan (core native; allowlisted AMD64 OK)
        run: python scripts/check_arm64_binaries.py --json

      - name: Run full suite incl. ARM64-only tests
        run: python -m pytest -p no:cacheprovider
